[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/de-l-invisible-a-la-matiere.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "attachment; filename=\"De-l-invisible-a-la-matiere-Gemmes-en-douceur.pdf\""
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
